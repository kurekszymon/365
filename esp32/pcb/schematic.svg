<svg viewBox="0 0 1000 560" class="sch" role="img" aria-label="Schematic of the fade lamp board">
<g class="w">
  <!-- rails -->
  <polyline points="70,50 940,50 940,92"/>
  <line x1="70" y1="520" x2="940" y2="520"/>
  <!-- J1 -->
  <line x1="70" y1="50" x2="70" y2="230"/><line x1="70" y1="310" x2="70" y2="520"/>
  <!-- C1 -->
  <line x1="200" y1="50" x2="200" y2="262"/><line x1="200" y1="278" x2="200" y2="520"/>
  <!-- buck -->
  <line x1="320" y1="50" x2="320" y2="110"/><line x1="340" y1="210" x2="340" y2="520"/>
  <line x1="440" y1="140" x2="491" y2="140"/><line x1="529" y1="140" x2="600" y2="140"/>
  <!-- pot -->
  <polyline points="600,250 460,250 460,280"/><line x1="460" y1="360" x2="460" y2="520"/>
  <line x1="472" y1="320" x2="600" y2="320"/>
  <!-- C4 -->
  <line x1="530" y1="320" x2="530" y2="400"/><line x1="530" y1="410" x2="530" y2="520"/>
  <!-- ESP GND -->
  <polyline points="600,450 580,450 580,520"/>
  <!-- PWM / gate -->
  <line x1="780" y1="230" x2="795" y2="230"/><line x1="835" y1="230" x2="905" y2="230"/>
  <!-- R2 -->
  <line x1="860" y1="230" x2="860" y2="255"/><polyline points="860,295 860,310 940,310"/>
  <!-- Q1 drain/source -->
  <polyline points="915,212 940,212 940,128"/>
  <polyline points="915,248 940,248 940,520"/>
  <!-- button / C3 -->
  <polyline points="780,400 870,400 870,430"/><line x1="870" y1="440" x2="870" y2="520"/>
  <line x1="820" y1="400" x2="820" y2="432"/><line x1="820" y1="468" x2="820" y2="520"/>
</g>
<!-- J1 connector -->
<rect class="blk" x="52" y="230" width="36" height="80" rx="3"/>
<circle class="term" cx="70" cy="250" r="6"/><circle class="term" cx="70" cy="290" r="6"/>
<text class="pm" x="58" y="226">+</text><text class="pm" x="58" y="328">−</text>
<text class="ref" x="98" y="262">J1</text><text class="val" x="98" y="278">24 V DC in</text>
<!-- C1 electrolytic -->
<line class="w" x1="182" y1="262" x2="218" y2="262"/>
<path class="w" d="M182,282 Q200,270 218,282"/>
<text class="pm" x="184" y="254">+</text>
<text class="ref" x="226" y="262">C1</text><text class="val" x="226" y="278">470µF 35V</text>
<!-- buck -->
<rect class="blk" x="300" y="110" width="140" height="100" rx="4"/>
<text class="ref" x="370" y="152" text-anchor="middle">U1 buck</text>
<text class="val" x="370" y="170" text-anchor="middle">24 V → 5 V</text>
<text class="tiny" x="370" y="190" text-anchor="middle">trim to 5.0 V first</text>
<text class="tiny" x="324" y="126">IN+</text><text class="tiny" x="434" y="134" text-anchor="end">OUT+</text>
<text class="tiny" x="344" y="204">GND</text>
<!-- JP1 -->
<circle class="term" cx="495" cy="140" r="4"/><circle class="term" cx="525" cy="140" r="4"/>
<rect class="jmp" x="488" y="128" width="44" height="7" rx="2"/>
<text class="ref" x="510" y="120" text-anchor="middle">JP1</text>
<text class="tiny" x="510" y="160" text-anchor="middle">remove for USB</text>
<!-- ESP32 -->
<rect class="blk esp" x="600" y="100" width="180" height="370" rx="6"/>
<text class="ref" x="690" y="290" text-anchor="middle">U2</text>
<text class="val" x="690" y="308" text-anchor="middle">ESP32 DevKit</text>
<g class="pinl">
  <text x="608" y="144">5V</text><text x="608" y="254">3V3</text><text x="608" y="324">IO36 · ADC1</text>
  <text x="608" y="454">GND</text>
  <text x="772" y="234" text-anchor="end">IO13 · PWM</text><text x="772" y="404" text-anchor="end">IO32</text>
</g>
<!-- pot -->
<rect class="part" x="450" y="280" width="20" height="80" rx="2"/>
<path class="w" d="M492,320 L474,320"/><path class="arrow" d="M472,320 l9,-5 v10 z"/>
<text class="ref" x="440" y="315" text-anchor="end">RV1</text><text class="val" x="440" y="331" text-anchor="end">10k linear</text>
<text class="tiny" x="440" y="347" text-anchor="end">via J3</text>
<!-- C4 -->
<line class="w" x1="515" y1="400" x2="545" y2="400"/><line class="w" x1="515" y1="410" x2="545" y2="410"/>
<text class="ref" x="550" y="398">C4</text><text class="val" x="550" y="414">100nF</text>
<!-- R1 -->
<rect class="part" x="795" y="222" width="40" height="16" rx="2"/>
<text class="ref" x="815" y="214" text-anchor="middle">R1</text><text class="val" x="815" y="256" text-anchor="middle">100Ω</text>
<!-- R2 -->
<rect class="part" x="852" y="255" width="16" height="40" rx="2"/>
<text class="ref" x="846" y="272" text-anchor="end">R2</text><text class="val" x="846" y="288" text-anchor="end">10k</text>
<!-- Q1 n-mosfet -->
<g class="w"><line x1="905" y1="210" x2="905" y2="250"/>
<line x1="915" y1="204" x2="915" y2="220"/><line x1="915" y1="222" x2="915" y2="238"/><line x1="915" y1="240" x2="915" y2="256"/>
<line x1="915" y1="230" x2="940" y2="230"/><line x1="940" y1="230" x2="940" y2="248"/></g>
<path class="arrow" d="M916,230 l9,-5 v10 z"/>
<text class="ref" x="954" y="226">Q1</text><text class="tiny" x="954" y="242">logic-level</text>
<text class="tiny" x="896" y="222" text-anchor="end">G</text><text class="tiny" x="948" y="206">D</text><text class="tiny" x="948" y="270">S</text>
<!-- LED strip -->
<rect class="blk" x="912" y="92" width="56" height="36" rx="3"/>
<path class="arrow" d="M930,100 h20 l-10,14 z"/><line class="w" x1="930" y1="116" x2="950" y2="116"/>
<text class="ref" x="976" y="104">J2</text><text class="val" x="976" y="120">LED</text>
<!-- button -->
<circle class="term" cx="820" cy="436" r="3.5"/><circle class="term" cx="820" cy="464" r="3.5"/>
<line class="w" x1="832" y1="432" x2="832" y2="468"/><line class="w" x1="832" y1="450" x2="842" y2="450"/>
<text class="ref" x="810" y="448" text-anchor="end">SW1</text><text class="tiny" x="810" y="464" text-anchor="end">via J4</text>
<text class="tiny" x="786" y="390">internal pull-up</text>
<!-- C3 -->
<line class="w" x1="856" y1="430" x2="884" y2="430"/><line class="w" x1="856" y1="440" x2="884" y2="440"/>
<text class="ref" x="890" y="430">C3</text><text class="val" x="890" y="446">100nF</text>
<!-- junction dots -->
<g class="dot">
  <circle cx="200" cy="50" r="4"/><circle cx="320" cy="50" r="4"/>
  <circle cx="200" cy="520" r="4"/><circle cx="340" cy="520" r="4"/><circle cx="460" cy="520" r="4"/>
  <circle cx="530" cy="520" r="4"/><circle cx="580" cy="520" r="4"/><circle cx="820" cy="520" r="4"/><circle cx="870" cy="520" r="4"/>
  <circle cx="530" cy="320" r="4"/><circle cx="860" cy="230" r="4"/><circle cx="940" cy="310" r="4"/><circle cx="820" cy="400" r="4"/>
</g>
<text class="rail" x="76" y="40">+24 V</text><text class="rail" x="76" y="544">GND</text>
</svg>
